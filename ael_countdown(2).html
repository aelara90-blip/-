<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ΑΕΛ – Αντίστροφη Μέτρηση</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #6B0C1E;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    padding: 2rem;
  }
  .card {
    background: #1a0508;
    border: 2px solid #8B1A2E;
    border-radius: 16px;
    padding: 3rem 2.5rem;
    text-align: center;
    max-width: 560px;
    width: 100%;
  }
  .logo {
    width: 140px;
    height: auto;
    margin-bottom: 1.5rem;
    filter: drop-shadow(0 0 12px rgba(255,255,255,0.15));
  }
  .subtitle {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin-bottom: 0.5rem;
  }
  .headline {
    font-size: 20px;
    font-weight: 600;
    color: #f0c040;
    letter-spacing: 1px;
    line-height: 1.4;
    margin-bottom: 0.4rem;
  }
  .subline {
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    margin-bottom: 2.5rem;
    letter-spacing: 1px;
  }
  .blocks {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 2rem;
  }
  .block {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 80px;
  }
  .num {
    font-size: 58px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    letter-spacing: -1px;
  }
  .lbl {
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.4);
    margin-top: 6px;
    text-transform: uppercase;
  }
  .sep {
    font-size: 48px;
    font-weight: 300;
    color: rgba(255,255,255,0.2);
    align-self: flex-start;
    padding-top: 6px;
    line-height: 1;
  }
  .bar-wrap {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    height: 4px;
    margin-bottom: 1.2rem;
    overflow: hidden;
  }
  .bar {
    height: 4px;
    background: #f0c040;
    border-radius: 4px;
    transition: width 1s linear;
  }
  .live-date {
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.5px;
  }
</style>
</head>

  <div class="headline">Η αντίστροφη μέτρηση για το μέλλον της ΑΕΛ έχει ήδη αρχίσει.</div>
  <div class="subline">17 Ιουνίου 2026 · 23:59 · Τότε θα ξέρουμε.</div>

<script>
const target = new Date('2026-06-17T23:59:00');
const start  = new Date();
function pad(n){return String(n).padStart(2,'0');}
function tick(){
  const now=new Date(), diff=target-now;
  if(diff<=0){
    ['days','hours','mins','secs'].forEach(id=>document.getElementById(id).textContent='00');
    document.getElementById('bar').style.width='100%';
    document.getElementById('livedate').textContent='Έφτασε η ώρα!';
    return;
  }
  const d=Math.floor(diff/86400000),
        h=Math.floor((diff%86400000)/3600000),
        m=Math.floor((diff%3600000)/60000),
        s=Math.floor((diff%60000)/1000);
  document.getElementById('days').textContent=pad(d);
  document.getElementById('hours').textContent=pad(h);
  document.getElementById('mins').textContent=pad(m);
  document.getElementById('secs').textContent=pad(s);
  const pct=Math.min(100,((now-start)/(target-start))*100).toFixed(2);
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('livedate').textContent=
    now.toLocaleDateString('el-GR',{weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
tick(); setInterval(tick,1000);
</script>
